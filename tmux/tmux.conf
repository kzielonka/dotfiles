# ---------------------------------------------------------
# General & Performance
# ---------------------------------------------------------
# Start window and pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Zero delay for Esc key (crucial for responsive Neovim mode switching)
set -s escape-time 0

# Increase scrollback buffer history from 2,000 to 50,000 lines
set -g history-limit 50000

# Enable focus events (allows Neovim to detect when switching panes)
set -g focus-events on

# Enable 24-bit TrueColor support for Neovim inside Tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support (off per your preference)
set -g mouse off

# ---------------------------------------------------------
# Keybindings
# ---------------------------------------------------------
# Use Vi keys in copy mode
setw -g mode-keys vi

# Reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Split panes using | and - (and preserve current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing (-r allows pressing H multiple times)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi copy mode: 'v' to begin selection, 'y' to copy to macOS clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------
# Theme & Status Bar (Clean Tokyo Night aesthetic)
# ---------------------------------------------------------
set -g status-position bottom
set -g status-style bg="#1f2335",fg="#7aa2f7"
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[bg=default,fg=default] "
set -g status-right "#[fg=#7aa2f7]%H:%M #[fg=#565f89]| #[fg=#7aa2f7]%d-%b-%y "
set -g window-status-current-format "#[fg=#ff9e64,bold][#I:#W]"
set -g window-status-format "#[fg=#565f89]#I:#W"
